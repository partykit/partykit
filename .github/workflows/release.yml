name: Release

# Both jobs live in this file because npm trusted publishing is configured
# per workflow file (release.yml) for each package.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing

    if: ${{ github.repository_owner == 'partykit' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # trusted publishing needs npm >= 11.5.1. Not 12: its `npm info --json`
      # returns an array, which makes changesets think nothing is published.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      - id: changesets
        uses: changesets/action@v1
        with:
          version: node .github/changeset-version.js
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.PARTYKIT_GITHUB_TOKEN }}

  prerelease:
    permissions:
      contents: read
      id-token: write # npm trusted publishing

    if: ${{ github.repository_owner == 'partykit' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # trusted publishing needs npm >= 11.5.1. Not 12: its `npm info --json`
      # returns an array, which makes changesets think nothing is published.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Modify package.json version
        run: node .github/version-script.js

      - run: npm run build
        env:
          PARTYKIT_API_BASE: https://beta-api.partykit.dev

      - run: npm run check

      - run: npm publish --tag beta
        working-directory: packages/partykit

      - run: npm publish --tag beta
        working-directory: packages/y-partykit

      - run: npm publish --tag beta
        working-directory: packages/partymix

      - run: npm publish --tag beta
        working-directory: packages/create-partykit

      - run: npm publish --tag beta
        working-directory: packages/party.io
